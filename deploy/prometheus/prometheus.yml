global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    stack: inferobs

rule_files:
  - /etc/prometheus/rules/*.yaml
  # Compressed-window SLO rules, mounted only by the faults overlay (deploy/lab-rules).
  - /etc/prometheus-lab/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The proxy serves OpenMetrics (and so exemplars) when asked; Prometheus 3 asks by default.
  - job_name: proxy
    static_configs:
      - targets: ["proxy:9000"]

  # vLLM or the simulator; both expose vllm:* metrics on /metrics.
  - job_name: engine
    static_configs:
      - targets: ["engine:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
