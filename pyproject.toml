[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inferobs"
version = "0.1.0"
description = "Observability for LLM inference: a streaming OpenAI-compatible metering proxy, a simulated engine, SLO rules and load/fault experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhay Khot" }]
dependencies = [
  "aiohttp>=3.10",
  "orjson>=3.10",
  "prometheus-client>=0.21",
  "pyyaml>=6.0",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
analysis = ["numpy>=1.26", "matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
inferobs = "inferobs.cli:main"

[tool.setuptools.packages.find]
include = ["inferobs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
